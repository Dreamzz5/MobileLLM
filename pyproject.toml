[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "MobileLLM"
version = "1.0.0"
description = "MobileLLM: Spatio-Temporal Large Language Model for Traffic Prediction"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "TMC Research Group", email = "research@tmc.edu"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.21.0",
    "peft>=0.4.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "matplotlib>=3.5.0",
    "torchinfo>=1.8.0",
    "pyyaml>=6.0",
    "scipy>=1.7.0",
    "scikit-learn>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/tmc-research/st-llm-plus"
Repository = "https://github.com/tmc-research/st-llm-plus"
Documentation = "https://st-llm-plus.readthedocs.io/"
Issues = "https://github.com/tmc-research/st-llm-plus/issues"

[tool.setuptools.packages]
find = {}

[tool.setuptools.package-data]
mobilellm = ["*.yaml"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
